{% comment %}Tab nav shared by the per-journal management pages. Pass `active`
as one of: team, rubrics, checklist.{% endcomment %}
<div class="mb-4">
    <a href="{% url 'journal_manage_list' %}" class="text-muted d-inline-flex align-items-center gap-1 mb-2" style="font-size:13px;">
        <i class="material-icons" style="font-size:15px;">arrow_back</i> All journals
    </a>
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
        <div>
            <span class="uj-kicker">{{ journal.department.name }}</span>
            <h1 class="mt-1 mb-0" style="font-size:28px;">{{ journal.name }}</h1>
        </div>
        <div class="d-flex gap-2">
            <a href="{% url 'journal_team' journal.pk %}" class="btn btn-sm {% if active == 'team' %}btn-primary{% else %}btn-light{% endif %}">
                <i class="material-icons" style="font-size:15px;">group</i> Team
            </a>
            <a href="{% url 'journal_rubrics' journal.pk %}" class="btn btn-sm {% if active == 'rubrics' %}btn-primary{% else %}btn-light{% endif %}">
                <i class="material-icons" style="font-size:15px;">rule</i> Rubrics
            </a>
            <a href="{% url 'journal_checklist' journal.pk %}" class="btn btn-sm {% if active == 'checklist' %}btn-primary{% else %}btn-light{% endif %}">
                <i class="material-icons" style="font-size:15px;">checklist</i> Checklist
            </a>
            <a href="{% url 'journal_fee' journal.pk %}" class="btn btn-sm {% if active == 'fee' %}btn-primary{% else %}btn-light{% endif %}">
                <i class="material-icons" style="font-size:15px;">payments</i> Fee
            </a>
        </div>
    </div>
</div>
