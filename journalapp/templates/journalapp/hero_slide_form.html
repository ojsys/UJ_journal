{% extends 'journalapp/base.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row"><div class="col-md-8 offset-md-2">
        <div class="mb-4">
            <span class="uj-kicker">Admin</span>
            <h1 class="mt-1 mb-0" style="font-size:28px;">{{ title }}</h1>
        </div>
        <div class="card"><div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'hero_slides' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="material-icons" style="font-size:17px;">save</i> Save</button>
                </div>
            </form>
        </div></div>
    </div></div>
</div>
{% endblock %}
