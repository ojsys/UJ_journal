{% extends 'journalapp/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Assign reviewer{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center"><div class="col-lg-8">
        <div class="mb-4">
            <span class="uj-kicker">Editorial</span>
            <h1 class="mt-1 mb-0" style="font-size:26px;">Assign reviewer</h1>
            <p class="text-muted mb-0 mt-1">for "{{ article.title }}"</p>
        </div>
        <div class="card"><div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'editor_dashboard' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="material-icons" style="font-size:17px;">person_add</i> Assign</button>
                </div>
            </form>
        </div></div>
    </div></div>
</div>
{% endblock %}
