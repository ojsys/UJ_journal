{% extends 'journalapp/base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="container">
    <div style="max-width:440px; margin:4rem auto;">
        <div class="uj-panel p-4 p-md-5">
            <div class="mb-3" style="width:46px;height:46px;border-radius:12px;background:var(--uj-grad-pink);display:flex;align-items:center;justify-content:center;color:#fff;"><i class="material-icons">lock_reset</i></div>
            <h2 class="mb-1">Reset your password</h2>
            <p class="text-muted mb-4" style="font-size:14.5px;">We'll email you a secure link to choose a new one.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label" for="id_email">Email address</label>
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="you@unijos.edu.ng" value="{{ form.email.value|default:'' }}" required>
                    {% if form.email.errors %}<div class="text-danger small mt-1">{{ form.email.errors.0 }}</div>{% endif %}
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary flex-grow-1 justify-content-center" type="submit">Send reset link</button>
                    <a class="btn btn-light" href="{% url 'login' %}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
