{% extends 'journalapp/base.html' %}
{% block title %}Password reset complete{% endblock %}
{% block content %}
<div class="container">
    <div style="max-width:460px; margin:4rem auto;">
        <div class="uj-panel p-4 p-md-5 text-center">
            <div class="mx-auto mb-3" style="width:56px;height:56px;border-radius:16px;background:var(--uj-success-bg);display:flex;align-items:center;justify-content:center;color:var(--uj-success-fg);"><i class="material-icons" style="font-size:28px;">check_circle</i></div>
            <h2 class="mb-2">Password reset complete</h2>
            <p class="text-muted mb-4" style="font-size:14.5px;">Your password has been set. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="btn btn-primary"><i class="material-icons" style="font-size:17px;">login</i> Go to log in</a>
        </div>
    </div>
</div>
{% endblock %}
